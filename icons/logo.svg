  <path d="M314 350 L410 350 L362 442 Z" fill="#FAFBF9" stroke="#FAFBF9" stroke-width="12" stroke-linejoin="round"/>
  <!-- отметка прямого угла -->
  <path d="M362 280 H324 V318" fill="none" stroke="#FAFBF9" stroke-width="10" stroke-linejoin="round" opacity=".6"/>
